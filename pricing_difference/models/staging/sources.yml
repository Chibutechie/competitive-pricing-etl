tables:
  - name: competitor_pricing
    columns:
      - name: comparison_id
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: date_checked
        data_tests:
          - not_null
      - name: competitor_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: our_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
