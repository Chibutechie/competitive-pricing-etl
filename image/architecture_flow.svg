<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1100 800" width="1100" height="800"
     font-family="Inter, system-ui, -apple-system, sans-serif">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Subtle card gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30,41,59,0.95)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.95)"/>
    </linearGradient>

    <!-- Arrowhead – grey (default connectors) -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>

    <!-- Arrowhead – blue (PostgreSQL → Power BI) -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>

    <!-- Drop-shadow for cards -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Soft glow for particles -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Stronger glow for PostgreSQL→Power BI particles -->
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ════════════════════════════════════════
       BACKGROUND
  ════════════════════════════════════════ -->
  <rect width="1100" height="800" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="200" x2="1100" y2="200"/>
    <line x1="0" y1="350" x2="1100" y2="350"/>
    <line x1="0" y1="500" x2="1100" y2="500"/>
    <line x1="0" y1="650" x2="1100" y2="650"/>
    <line x1="370" y1="80" x2="370" y2="800"/>
    <line x1="720" y1="80" x2="720" y2="800"/>
  </g>

  <!-- ════════════════════════════════════════
       TITLES
  ════════════════════════════════════════ -->
  <text x="550" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="url(#titleGrad)">
    Competitive Pricing ETL Pipeline
  </text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#475569">
    Hugging Face  ›  extract  ›  transform  ›  load  ›  PostgreSQL  ›  Power BI
  </text>

  <!-- Column header pills -->
  <rect x="75"  y="82" width="290" height="24" rx="12" fill="rgba(56,189,248,0.1)"  stroke="rgba(56,189,248,0.3)"  stroke-width="1"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">ETL SCRIPTS</text>

  <rect x="640" y="82" width="320" height="24" rx="12" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="800" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">DATA STORAGE &amp; BI</text>

  <!-- ════════════════════════════════════════
       LEFT COLUMN — ETL scripts (center x=220)
       Card: x=75, w=290
       Rows: y=115, y=255, y=395, y=535
  ════════════════════════════════════════ -->

  <!-- ── Hugging Face API ── -->
  <g filter="url(#shadow)">
    <rect x="75"  y="115" width="290" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="75"  y="115" width="290" height="4"  rx="2"  fill="#f59e0b"/>
  </g>
  <text x="220" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">🤗  Hugging Face API</text>
  <text x="220" y="164" text-anchor="middle" font-size="12" fill="#64748b">Source Data Provider</text>

  <!-- ── extract.py ── -->
  <g filter="url(#shadow)">
    <rect x="75"  y="255" width="290" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="75"  y="255" width="290" height="4"  rx="2"  fill="#22d3ee"/>
  </g>
  <text x="220" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#22d3ee">📥  extract.py</text>
  <text x="220" y="304" text-anchor="middle" font-size="12" fill="#64748b">Data Ingestion Script</text>

  <!-- ── transform.py ── -->
  <g filter="url(#shadow)">
    <rect x="75"  y="395" width="290" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="75"  y="395" width="290" height="4"  rx="2"  fill="#a78bfa"/>
  </g>
  <text x="220" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">⚙  transform.py</text>
  <text x="220" y="444" text-anchor="middle" font-size="12" fill="#64748b">Cleaning &amp; Metric Calculation</text>

  <!-- ── load.py ── -->
  <g filter="url(#shadow)">
    <rect x="75"  y="535" width="290" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="75"  y="535" width="290" height="4"  rx="2"  fill="#f472b6"/>
  </g>
  <text x="220" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#f472b6">📤  load.py</text>
  <text x="220" y="584" text-anchor="middle" font-size="12" fill="#64748b">Database Insertion</text>

  <!-- ════════════════════════════════════════
       RIGHT COLUMN — Storage / BI (center x=800)
       Card: x=640, w=320
       Rows: y=255, y=395, y=535, y=680
  ════════════════════════════════════════ -->

  <!-- ── data/raw/competitor_pricing.csv ── -->
  <g filter="url(#shadow)">
    <rect x="640" y="255" width="320" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="640" y="255" width="320" height="4"  rx="2"  fill="#818cf8"/>
  </g>
  <text x="800" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#818cf8">📄  data/raw/competitor_pricing.csv</text>
  <text x="800" y="302" text-anchor="middle" font-size="12" fill="#64748b">Raw Data Storage</text>

  <!-- ── data/processed/sales_clean.csv ── -->
  <g filter="url(#shadow)">
    <rect x="640" y="395" width="320" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="640" y="395" width="320" height="4"  rx="2"  fill="#818cf8"/>
  </g>
  <text x="800" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#818cf8">✨  data/processed/sales_clean.csv</text>
  <text x="800" y="442" text-anchor="middle" font-size="12" fill="#64748b">Processed Data Storage</text>

  <!-- ── PostgreSQL ── -->
  <g filter="url(#shadow)">
    <rect x="640" y="535" width="320" height="68" rx="14" fill="url(#cardBg)" stroke="rgba(96,165,250,0.3)" stroke-width="1.5"/>
    <rect x="640" y="535" width="320" height="4"  rx="2"  fill="#60a5fa"/>
  </g>
  <text x="800" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#60a5fa">🐘  PostgreSQL</text>
  <text x="800" y="584" text-anchor="middle" font-size="12" fill="#64748b">competitor_pricing DB</text>

  <!-- ── Power BI Dashboard ── -->
  <g filter="url(#shadow)">
    <rect x="640" y="680" width="320" height="72" rx="14" fill="url(#cardBg)" stroke="rgba(234,179,8,0.35)" stroke-width="1.5"/>
    <rect x="640" y="680" width="320" height="4"  rx="2"  fill="#eab308"/>
  </g>
  <text x="800" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#eab308">📊  Power BI Dashboard</text>
  <text x="800" y="732" text-anchor="middle" font-size="12" fill="#64748b">Business Intelligence Reporting</text>

  <!-- ════════════════════════════════════════
       STAGE BADGES (left margin)
  ════════════════════════════════════════ -->
  <!-- EXTRACT badge: between HF (row 115-183) and extract (255-323) → midpoint y≈219 -->
  <rect x="10" y="208" width="58" height="22" rx="11" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1"/>
  <text x="39"  y="223" text-anchor="middle" font-size="9" font-weight="700" fill="#22d3ee">EXTRACT</text>

  <!-- TRANSFORM badge: between extract (255-323) and transform (395-463) → midpoint y≈359 -->
  <rect x="4"  y="348" width="70" height="22" rx="11" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1"/>
  <text x="39"  y="363" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bfa">TRANSFORM</text>

  <!-- LOAD badge: between transform (395-463) and load (535-603) → midpoint y≈499 -->
  <rect x="16" y="488" width="46" height="22" rx="11" fill="rgba(244,114,182,0.12)" stroke="#f472b6" stroke-width="1"/>
  <text x="39"  y="503" text-anchor="middle" font-size="9" font-weight="700" fill="#f472b6">LOAD</text>

  <!-- ════════════════════════════════════════
       CONNECTOR PATHS — all with inline animations
  ════════════════════════════════════════ -->

  <!-- v1: HF → extract.py  (x=220, y:183→253) -->
  <path id="v1" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 220 183 L 220 253">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- v2: extract → transform  (x=220, y:323→393) -->
  <path id="v2" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 220 323 L 220 393">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- v3: transform → load  (x=220, y:463→533) -->
  <path id="v3" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 220 463 L 220 533">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- h1: extract → raw CSV  (y=289, x:367→638) -->
  <path id="h1" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 367 289 L 638 289">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- h2: transform → processed CSV  (y=429, x:367→638) -->
  <path id="h2" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 367 429 L 638 429">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- h3: load → PostgreSQL  (y=569, x:367→638) -->
  <path id="h3" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"
        d="M 367 569 L 638 569">
    <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- pg2pbi: PostgreSQL → Power BI  (x=800, y:603→678) — highlighted blue -->
  <path id="pg2pbi" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="10 5" marker-end="url(#arrow-blue)"
        d="M 800 603 L 800 678">
    <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Badge label on PostgreSQL → Power BI connector -->
  <rect x="715" y="631" width="170" height="20" rx="10" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.45)" stroke-width="1"/>
  <text x="800" y="645" text-anchor="middle" font-size="10" font-weight="700" fill="#60a5fa">DirectQuery / Import</text>

  <!-- ════════════════════════════════════════
       ANIMATED PARTICLES (animateMotion with xlink:href mpath)
  ════════════════════════════════════════ -->

  <!-- HF → extract (amber) -->
  <circle r="4" fill="#f59e0b" filter="url(#glow)">
    <animateMotion dur="2s" begin="0s"   repeatCount="indefinite"><mpath xlink:href="#v1"/></animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b" filter="url(#glow)">
    <animateMotion dur="2s" begin="1s"   repeatCount="indefinite"><mpath xlink:href="#v1"/></animateMotion>
  </circle>

  <!-- extract → transform (cyan) -->
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="2s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#v2"/></animateMotion>
  </circle>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="2s" begin="1.3s" repeatCount="indefinite"><mpath xlink:href="#v2"/></animateMotion>
  </circle>

  <!-- transform → load (violet) -->
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="2s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#v3"/></animateMotion>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="2s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#v3"/></animateMotion>
  </circle>

  <!-- extract → raw CSV (indigo) -->
  <circle r="4" fill="#818cf8" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#h1"/></animateMotion>
  </circle>
  <circle r="4" fill="#818cf8" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite"><mpath xlink:href="#h1"/></animateMotion>
  </circle>

  <!-- transform → processed CSV (indigo) -->
  <circle r="4" fill="#818cf8" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#h2"/></animateMotion>
  </circle>
  <circle r="4" fill="#818cf8" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#h2"/></animateMotion>
  </circle>

  <!-- load → PostgreSQL (pink) -->
  <circle r="4" fill="#f472b6" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite"><mpath xlink:href="#h3"/></animateMotion>
  </circle>
  <circle r="4" fill="#f472b6" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.7s" repeatCount="indefinite"><mpath xlink:href="#h3"/></animateMotion>
  </circle>

  <!-- PostgreSQL → Power BI (blue + yellow – large glowing) -->
  <circle r="5.5" fill="#60a5fa" filter="url(#glowStrong)">
    <animateMotion dur="1.5s" begin="0s"    repeatCount="indefinite"><mpath xlink:href="#pg2pbi"/></animateMotion>
  </circle>
  <circle r="5.5" fill="#eab308" filter="url(#glowStrong)">
    <animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite"><mpath xlink:href="#pg2pbi"/></animateMotion>
  </circle>

</svg>
